<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WORD ORDER QUEST - 英文法並べ替えドリル (中1)</title>
  <style>
    :root {
      --bg-dark: #080b14;
      --card-bg: rgba(16, 23, 42, 0.88);
      --border-neon: rgba(56, 189, 248, 0.4);
      --neon-cyan: #00f0ff;
      --cyan-glow: rgba(0, 240, 255, 0.45);
      --neon-pink: #ff2a85;
      --pink-glow: rgba(255, 42, 133, 0.5);
      --neon-purple: #a855f7;
      --purple-glow: rgba(168, 85, 247, 0.4);
      --neon-yellow: #fde047;
      --yellow-glow: rgba(253, 224, 71, 0.4);
      --neon-green: #10b981;
      --green-glow: rgba(16, 185, 129, 0.45);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(0, 240, 255, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 90% 10%, rgba(255, 42, 133, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 50% 80%, rgba(168, 85, 247, 0.15) 0%, transparent 50%);
      color: var(--text-main);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .container {
      width: 100%;
      max-width: 660px;
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border-neon);
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(0, 240, 255, 0.15);
      position: relative;
    }

    /* 学習ステータス（ネオンメーター風） */
    .status-dashboard {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.9) 0%, rgba(30, 41, 59, 0.7) 100%);
      border: 1px solid var(--neon-cyan);
      border-radius: 14px;
      padding: 12px 16px;
      margin-bottom: 22px;
      display: flex;
      justify-content: space-around;
      text-align: center;
      box-shadow: 0 0 15px var(--cyan-glow), inset 0 0 15px rgba(0, 240, 255, 0.1);
    }
    .status-item { display: flex; flex-direction: column; gap: 3px; }
    .status-label {
      font-size: 11px;
      font-weight: 800;
      color: var(--neon-cyan);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .status-val {
      font-size: 16px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
    }

    /* ステージ選択カード */
    .stage-list { display: flex; flex-direction: column; gap: 10px; }
    .btn-stage {
      background: rgba(30, 41, 59, 0.65);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 12px;
      padding: 14px 18px;
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-main);
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }
    .btn-stage::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 4px; height: 100%;
      background: var(--neon-cyan);
      box-shadow: 0 0 10px var(--neon-cyan);
    }
    .btn-stage:hover {
      border-color: var(--neon-cyan);
      background: rgba(40, 56, 84, 0.85);
      transform: translateY(-2px);
      box-shadow: 0 0 18px var(--cyan-glow);
    }
    .btn-stage.cleared {
      border-color: var(--neon-green);
      background: rgba(16, 185, 129, 0.08);
    }
    .btn-stage.cleared::before {
      background: var(--neon-green);
      box-shadow: 0 0 10px var(--neon-green);
    }
    .stage-num {
      font-size: 15px;
      font-weight: 900;
      color: var(--neon-cyan);
      letter-spacing: 0.5px;
    }
    .stage-name {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      margin-left: 8px;
    }
    .crest-badge {
      font-size: 12px;
      font-weight: 800;
      color: #34d399;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--neon-green);
      padding: 4px 10px;
      border-radius: 20px;
      display: none;
      box-shadow: 0 0 8px var(--green-glow);
    }
    .btn-stage.cleared .crest-badge { display: inline-block; }

    /* サブステージ選択カード (1-1, 1-2, 1-BOSS) */
    .substage-btn {
      background: rgba(30, 41, 59, 0.7);
      border: 1.5px solid rgba(56, 189, 248, 0.3);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      color: white;
      transition: all 0.2s;
    }
    .substage-btn:hover {
      border-color: var(--neon-cyan);
      background: rgba(0, 240, 255, 0.12);
      transform: translateX(4px);
      box-shadow: 0 0 14px var(--cyan-glow);
    }
    .substage-btn.boss-card {
      border-color: var(--neon-pink);
      background: linear-gradient(135deg, rgba(255, 42, 133, 0.15) 0%, rgba(30, 41, 59, 0.8) 100%);
    }
    .substage-btn.boss-card:hover {
      border-color: #ff4d9a;
      box-shadow: 0 0 20px var(--pink-glow);
    }
    .substage-badge {
      font-size: 11px;
      font-weight: 800;
      background: rgba(0, 240, 255, 0.15);
      color: var(--neon-cyan);
      padding: 3px 8px;
      border-radius: 8px;
      border: 1px solid rgba(0, 240, 255, 0.3);
    }

    /* クイズ画面ヘッダー */
    .battle-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .stage-tag {
      background: rgba(0, 240, 255, 0.15);
      color: var(--neon-cyan);
      border: 1px solid var(--neon-cyan);
      padding: 4px 10px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 13px;
      box-shadow: 0 0 8px var(--cyan-glow);
    }
    .combo-badge {
      font-size: 12px;
      font-weight: 900;
      color: var(--neon-yellow);
      background: rgba(253, 224, 71, 0.15);
      border: 1px solid var(--neon-yellow);
      padding: 3px 10px;
      border-radius: 12px;
      display: none;
      box-shadow: 0 0 10px var(--yellow-glow);
      animation: comboBlink 1.2s infinite alternate;
    }
    @keyframes comboBlink {
      from { transform: scale(1); }
      to { transform: scale(1.04); }
    }

    /* きらきらピクセルボス枠（boss.jpeg専用） */
    .boss-view-card {
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.95) 0%, rgba(30, 41, 59, 0.85) 100%);
      border: 2px solid var(--neon-pink);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 16px;
      text-align: center;
      box-shadow: 0 0 24px var(--pink-glow);
      display: none;
      animation: neonPulse 2s infinite alternate;
    }
    @keyframes neonPulse {
      0% { box-shadow: 0 0 16px var(--pink-glow); }
      100% { box-shadow: 0 0 30px var(--pink-glow); }
    }
    .boss-img-real {
      width: 140px;
      height: 140px;
      object-fit: cover;
      image-rendering: pixelated;
      border-radius: 12px;
      border: 2px solid var(--neon-purple);
      margin: 0 auto;
      box-shadow: 0 0 15px var(--purple-glow);
      display: block;
    }
    .boss-warning-tag {
      font-size: 13px;
      font-weight: 900;
      color: #ff80b3;
      letter-spacing: 0.5px;
      margin-top: 8px;
      text-shadow: 0 0 8px var(--pink-glow);
    }

    /* ネオンプログレスバー */
    .progress-bar-container {
      width: 100%;
      height: 7px;
      background: rgba(30, 41, 59, 0.8);
      border-radius: 4px;
      margin-bottom: 14px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
      transition: width 0.3s ease;
      box-shadow: 0 0 10px var(--cyan-glow);
    }

    /* 問題カード */
    .quest-box {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 16px;
      line-height: 1.45;
      color: #ffffff;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 14px 16px;
      border-radius: 12px;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
    }
    .context-hint {
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 4px;
      display: block;
    }
    .area-label {
      font-size: 11px;
      font-weight: 800;
      color: #94a3b8;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    /* 解答欄 & 単語チップ */
    .answer-box {
      min-height: 60px;
      background: rgba(15, 23, 42, 0.8);
      border: 2px dashed rgba(0, 240, 255, 0.4);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 18px;
      transition: border-color 0.2s;
    }
    .options-box {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 52px;
      margin-bottom: 22px;
    }
    .chip {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1.5px solid #334155;
      color: #f1f5f9;
      border-radius: 10px;
      padding: 9px 15px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .chip:hover {
      border-color: var(--neon-cyan);
      transform: translateY(-2px);
      box-shadow: 0 0 12px var(--cyan-glow);
    }
    .chip-first {
      border-color: var(--neon-cyan);
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.2) 0%, rgba(15, 23, 42, 0.9) 100%);
      color: var(--neon-cyan);
      font-weight: 800;
      box-shadow: 0 0 12px var(--cyan-glow);
    }

    /* 操作ボタン */
    .btn-row { display: flex; gap: 10px; }
    button {
      flex: 1;
      padding: 12px;
      font-size: 15px;
      font-weight: 800;
      border-radius: 10px;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      box-shadow: none !important;
    }
    .btn-submit {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      border: 1px solid var(--neon-cyan);
      color: white;
      box-shadow: 0 0 14px var(--cyan-glow);
    }
    .btn-submit:hover:not(:disabled) {
      background: #0ea5e9;
      box-shadow: 0 0 20px var(--cyan-glow);
    }
    .btn-reset {
      background: rgba(51, 65, 85, 0.6);
      color: #cbd5e1;
      border: 1px solid #475569;
    }
    .btn-reset:hover:not(:disabled) { background: rgba(71, 85, 105, 0.8); }
    .btn-back {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #94a3b8;
      padding: 5px 12px;
      font-size: 12px;
      border-radius: 6px;
      flex: none;
    }
    .btn-back:hover { border-color: #fff; color: #fff; }

    /* 判定結果ボックス */
    .result-box {
      margin-top: 18px;
      padding: 16px;
      border-radius: 12px;
      display: none;
    }
    .result-correct {
      background: rgba(16, 185, 129, 0.15);
      border: 1.5px solid var(--neon-green);
      color: #6ee7b7;
      box-shadow: 0 0 16px var(--green-glow);
    }
    .result-wrong {
      background: rgba(239, 68, 68, 0.15);
      border: 1.5px solid #ef4444;
      color: #fca5a5;
    }
    .result-hint {
      background: rgba(245, 158, 11, 0.15);
      border: 1.5px solid var(--neon-yellow);
      color: #fde68a;
      box-shadow: 0 0 14px var(--yellow-glow);
    }
    .btn-next {
      margin-top: 12px;
      width: 100%;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      box-shadow: 0 0 14px var(--green-glow);
    }

    /* クラッカーキャンバス */
    #confetti-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }

    /* モーダル */
    .congrats-modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(5, 8, 16, 0.88);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .congrats-card {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 2px solid var(--neon-yellow);
      padding: 28px 24px;
      border-radius: 18px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      box-shadow: 0 0 30px var(--yellow-glow);
    }
  </style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<!-- ステージクリアモーダル -->
<div class="congrats-modal-overlay" id="congrats-modal">
  <div class="congrats-card">
    <div style="font-size: 42px; margin-bottom: 6px;" id="modal-icon">🎉 ⭕ ✨</div>
    <h2 style="font-size: 22px; margin: 0; color: #fde047; text-shadow: 0 0 10px var(--yellow-glow);" id="modal-title">CLEAR!</h2>
    <p style="font-size: 14px; color: #cbd5e1; margin: 10px 0 16px;" id="modal-desc">すべての問題をクリアしました！</p>
    <button onclick="closeCongratsModal()" style="background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: white; padding: 12px; border-radius: 10px; width: 100%; font-size: 15px; box-shadow: 0 0 14px var(--yellow-glow);">
      ステージ選択へ戻る
    </button>
  </div>
</div>

<div class="container">
  <!-- 1. メインステージ選択 -->
  <div id="main-menu-view">
    <div style="text-align: center; margin-bottom: 16px;">
      <h1 style="font-size: 22px; margin: 0 0 4px 0; color: #f8fafc; text-shadow: 0 0 12px var(--cyan-glow);">
        WORD ORDER QUEST
      </h1>
      <p style="font-size: 13px; color: var(--text-sub); margin: 0;">中1 英文法 語順トレーニング</p>
    </div>

    <div class="status-dashboard">
      <div class="status-item">
        <span class="status-label">連続日数</span>
        <span class="status-val" id="streak-days">1日</span>
      </div>
      <div class="status-item">
        <span class="status-label">スコア</span>
        <span class="status-val" id="exp-count" style="color: var(--neon-cyan);">0 pt</span>
      </div>
      <div class="status-item">
        <span class="status-label">制覇ステージ</span>
        <span class="status-val" id="stamps-count">0 / 10</span>
      </div>
    </div>

    <div class="stage-list" id="stage-buttons"></div>
  </div>

  <!-- 2. サブステージ選択（1-1, 1-2, 1-3, 1-BOSS） -->
  <div id="substage-menu-view" style="display: none;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;">
      <button class="btn-back" onclick="backToMainMenu()">◀ ステージ選択へ</button>
      <span class="stage-tag" id="substage-main-title"></span>
    </div>
    <div style="text-align: center; margin-bottom: 16px;">
      <h2 style="font-size: 18px; margin: 0 0 4px; color: #fff;" id="substage-heading"></h2>
      <p style="font-size: 12px; color: #94a3b8; margin: 0;">挑戦するパートを選んでください</p>
    </div>
    <div class="stage-list" id="substage-buttons"></div>
  </div>

  <!-- 3. バトル（問題解答）画面 -->
  <div id="quiz-view" style="display: none;">
    <div class="battle-header">
      <div>
        <button class="btn-back" onclick="backToSubstageMenu()">◀ もどる</button>
        <span class="stage-tag" id="current-battle-title" style="margin-left: 6px;"></span>
      </div>
      <div style="display: flex; gap: 8px; align-items: center;">
        <span class="combo-badge" id="combo-display">⚡ 2 COMBO!</span>
        <span id="progress" style="font-size: 12px; font-weight: 700; color: #94a3b8;"></span>
      </div>
    </div>

    <!-- ネオンバー -->
    <div class="progress-bar-container">
      <div class="progress-bar-fill" id="hp-progress"></div>
    </div>

    <!-- ピクセル画ボス表示（boss.jpeg専用フレーム） -->
    <div class="boss-view-card" id="boss-card">
      <img src="boss.jpeg" alt="BOSS: WORD SCRAMBLER" class="boss-img-real" onerror="this.style.display='none';">
      <div class="boss-warning-tag">⚠️ BOSS BATTLE：不要な単語を1つ見抜け！</div>
    </div>

    <div class="quest-box" id="jp-text"></div>

    <div class="area-label">ならべた英文（タップで戻す）</div>
    <div class="answer-box" id="answer-box"></div>

    <div class="area-label">えらぶ単語</div>
    <div class="options-box" id="options-box"></div>

    <div class="btn-row">
      <button class="btn-reset" id="btn-reset-action" onclick="resetCurrentQuestion()">リセット</button>
      <button class="btn-submit" id="btn-submit-action" onclick="checkAnswer()">決定する</button>
    </div>

    <div class="result-box" id="result-box">
      <strong id="result-title" style="font-size: 15px; display: block; margin-bottom: 4px;"></strong>
      <p id="correct-answer-text" style="font-weight: 700; margin: 4px 0 8px;"></p>
      <button class="btn-next" id="btn-next-action" onclick="nextQuestion()">次の問題へ進む ▶</button>
    </div>
  </div>
</div>

<script>
  // メインステージ定義（純粋な文法項目名）
  const mainStageList = [
    { id: "Stage 1", name: "STAGE 1", grammar: "be動詞 / 一般動詞" },
    { id: "Stage 2", name: "STAGE 2", grammar: "助動詞 can / 人称代名詞" },
    { id: "Stage 3", name: "STAGE 3", grammar: "疑問詞 (5W1H)" },
    { id: "Stage 4", name: "STAGE 4", grammar: "命令文 / 数量・時刻" },
    { id: "Stage 5", name: "STAGE 5", grammar: "三人称単数現在 (三単現の -s)" },
    { id: "Stage 6", name: "STAGE 6", grammar: "代名詞の格変化 / Whose / Which" },
    { id: "Stage 7", name: "STAGE 7", grammar: "現在進行形 (be + -ing) / 感嘆文" },
    { id: "Stage 8", name: "STAGE 8", grammar: "不定詞 (to + 動詞の原形)" },
    { id: "Stage 9", name: "STAGE 9", grammar: "一般動詞の過去形" },
    { id: "Stage 10", name: "STAGE 10", grammar: "be動詞の過去形 / 過去進行形 / There is" }
  ];

  // サブステージ定義
  const subStageList = [
    // STAGE 1
    { id: "1-1", stageId: "Stage 1", num: "1-1", title: "be動詞の肯定文", count: 4, isBoss: false },
    { id: "1-2", stageId: "Stage 1", num: "1-2", title: "一般動詞（肯定・否定・疑問）", count: 6, isBoss: false },
    { id: "1-3", stageId: "Stage 1", num: "1-3", title: "be動詞の否定文・疑問文", count: 11, isBoss: false },
    { id: "1-BOSS", stageId: "Stage 1", num: "1-BOSS", title: "チャレンジ問題（不要語あり）", count: 1, isBoss: true },

    // STAGE 2
    { id: "2-1", stageId: "Stage 2", num: "2-1", title: "He, She is の文", count: 8, isBoss: false },
    { id: "2-2", stageId: "Stage 2", num: "2-2", title: "助動詞 can の文", count: 6, isBoss: false },
    { id: "2-3", stageId: "Stage 2", num: "2-3", title: "This, That is の文", count: 6, isBoss: false },
    { id: "2-BOSS", stageId: "Stage 2", num: "2-BOSS", title: "チャレンジ問題（不要語あり）", count: 1, isBoss: true },

    // STAGE 3
    { id: "3-1", stageId: "Stage 3", num: "3-1", title: "What / Who の疑問文", count: 4, isBoss: false },
    { id: "3-2", stageId: "Stage 3", num: "3-2", title: "How / When の疑問文", count: 3, isBoss: false },
    { id: "3-3", stageId: "Stage 3", num: "3-3", title: "Where の疑問文", count: 2, isBoss: false },
    { id: "3-BOSS", stageId: "Stage 3", num: "3-BOSS", title: "チャレンジ問題（不要語あり）", count: 1, isBoss: true },

    // STAGE 4

  function isProperNoun(word) { return properNouns.includes(word); }
  function isAlwaysCapitalI(word) { return word === "I" || word === "I'm"; }

  function maskFirstLetter(word) {
    if (isAlwaysCapitalI(word) || isProperNoun(word)) return word;
    if (/^[.,?!]$/.test(word)) return word;
    return word.charAt(0).toLowerCase() + word.slice(1);
  }

  function formatForAnswerBox(word, index) {
    if (isAlwaysCapitalI(word) || isProperNoun(word)) return word;
    if (/^[.,?!]$/.test(word)) return word;
    if (index === 0) return word.charAt(0).toUpperCase() + word.slice(1);
    return word.charAt(0).toLowerCase() + word.slice(1);
  }

  // --- ローカルストレージ ---
  function getClearedSubStages() {
    return JSON.parse(localStorage.getItem('wordorder_neon_cleared') || '[]');
  }
  function saveClearedSubStage(subId) {
    const list = getClearedSubStages();
    if (!list.includes(subId)) {
      list.push(subId);
      localStorage.setItem('wordorder_neon_cleared', JSON.stringify(list));
    }
  }

  function getTotalExp() {
    return parseInt(localStorage.getItem('wordorder_neon_exp') || '0', 10);
  }
  function addExp(amount) {
    const total = getTotalExp() + amount;
    localStorage.setItem('wordorder_neon_exp', total);
    return total;
  }

  function updateDailyStreak() {
    const today = new Date().toISOString().slice(0, 10);
    const lastDate = localStorage.getItem('wordorder_neon_date');
    let streak = parseInt(localStorage.getItem('wordorder_neon_streak') || '1', 10);
    if (lastDate) {
      const diffDays = Math.floor((new Date(today) - new Date(lastDate)) / (1000 * 60 * 60 * 24));
      if (diffDays === 1) streak += 1;
      else if (diffDays > 1) streak = 1;
    }
    localStorage.setItem('wordorder_neon_date', today);
    localStorage.setItem('wordorder_neon_streak', streak);
    return streak;
  }

  // --- メインメニュー画面 ---
  function initMainMenu() {

    document.getElementById('streak-days').innerText = `${streak}日連続`;
    document.getElementById('exp-count').innerText = `${exp} pt`;

    let clearedMainStagesCount = 0;
    const stageBox = document.getElementById('stage-buttons');
    stageBox.innerHTML = '';

    mainStageList.forEach(m => {
      const subs = subStageList.filter(s => s.stageId === m.id);
      const isAllCleared = subs.every(s => clearedSubs.includes(s.id));
      if (isAllCleared) clearedMainStagesCount++;

      const btn = document.createElement('button');
      btn.className = `btn-stage ${isAllCleared ? 'cleared' : ''}`;
      btn.innerHTML = `
        <div>
          <span class="stage-num">${m.name}</span>
          <span class="stage-name">${m.grammar}</span>
        </div>
        <span class="crest-badge">CLEAR!</span>
      `;
      btn.onclick = () => openSubStageMenu(m.id);
      stageBox.appendChild(btn);
    });

    document.getElementById('stamps-count').innerText = `${clearedMainStagesCount} / 10`;
  }

  // --- クイズ画面 ---
  function startSubStage(subId) {
    currentSubStageId = subId;
    currentQuestions = quizData.filter(q => q.subId === subId);
    const subObj = subStageList.find(s => s.id === subId);

    currentIndex = 0;
    comboCount = 0;
    updateComboDisplay();

    document.getElementById('substage-menu-view').style.display = 'none';
    document.getElementById('quiz-view').style.display = 'block';
    document.getElementById('current-battle-title').innerText = `${subObj.num}: ${subObj.title}`;

    const bossCard = document.getElementById('boss-card');
    if (subObj.isBoss) {
      bossCard.style.display = 'block';
    } else {
      bossCard.style.display = 'none';
    }

    loadQuestion(0);
  }

  function updateComboDisplay() {
    const badge = document.getElementById('combo-display');
    if (comboCount >= 2) {
      badge.style.display = 'inline-block';
      badge.innerText = `⚡ ${comboCount} COMBO!`;
    } else {
      badge.style.display = 'none';
    }
  }

  function loadQuestion(index) {
    const q = currentQuestions[index];
    wrongCount = 0;
    isAnswered = false; // ★新しい問題になったのでロック解除

    // ボタンを有効に戻す
    document.getElementById('btn-submit-action').disabled = false;
    document.getElementById('btn-reset-action').disabled = false;

    const progressPercent = ((index + 1) / currentQuestions.length) * 100;
    document.getElementById('hp-progress').style.width = `${progressPercent}%`;
    document.getElementById('progress').innerText = `第 ${index + 1} 問 / 全 ${currentQuestions.length} 問`;

    const hintHtml = q.hint ? `<span class="context-hint">${q.hint}</span>` : '';
    document.getElementById('jp-text').innerHTML = `${hintHtml}${q.japanese}`;
    document.getElementById('result-box').style.display = 'none';

    const maskedWords = q.words.map(w => maskFirstLetter(w));
    let shuffled = [...maskedWords];
    let attempts = 0;
    do {
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      attempts++;
    } while (shuffled.length > 1 && shuffled.join(' ') === maskedWords.join(' ') && attempts < 10);

    availableWords = shuffled;
    userSelectedWords = [];
    render();
  }

  function render() {
    const ansBox = document.getElementById('answer-box');
    const optBox = document.getElementById('options-box');
    ansBox.innerHTML = '';
    optBox.innerHTML = '';

    userSelectedWords.forEach((rawWord, idx) => {
      const displayWord = formatForAnswerBox(rawWord, idx);
      const chip = document.createElement('button');
      chip.className = `chip ${idx === 0 ? 'chip-first' : ''}`;
      chip.innerText = displayWord;
      chip.onclick = () => { if (!isAnswered) removeWord(idx); }; // ★正解後は入れ替え不可
      ansBox.appendChild(chip);
    });

    availableWords.forEach((word, idx) => {
      const chip = document.createElement('button');
      chip.className = 'chip';
      chip.innerText = word;
      chip.onclick = () => { if (!isAnswered) selectWord(idx); }; // ★正解後は選択不可
      optBox.appendChild(chip);
    });
  }

  function selectWord(idx) {
    userSelectedWords.push(availableWords.splice(idx, 1)[0]);
    render();
  }

  function removeWord(idx) {
    let word = userSelectedWords.splice(idx, 1)[0];
    availableWords.push(maskFirstLetter(word));
    render();
  }

  function resetCurrentQuestion() {
    if (isAnswered) return; // ★正解後はリセット無効
    loadQuestion(currentIndex);
  }

  function checkAnswer() {
    if (isAnswered) return; // ★すでに正解・完了している場合は連打を完全に無視

    const q = currentQuestions[currentIndex];
    const userTokens = userSelectedWords.map(w => w.toLowerCase()).join(' ');
    const target = q.targetWords ? q.targetWords : q.words;
    const correctTokens = target.map(w => w.toLowerCase()).join(' ');
    const displayAns = q.answer.replace(/\s+([,\.?!])/g, '$1');

    const resultBox = document.getElementById('result-box');
    const title = document.getElementById('result-title');
    const correctAns = document.getElementById('correct-answer-text');
    const btnNext = document.getElementById('btn-next-action');

    resultBox.style.display = 'block';

    if (userTokens === correctTokens) {
      isAnswered = true; // ★即座にロックして連打によるコンボ・pt加算を遮断
      document.getElementById('btn-submit-action').disabled = true;
      document.getElementById('btn-reset-action').disabled = true;

      comboCount++;
      addExp(10);
      updateComboDisplay();

      const randomPraise = praiseList[Math.floor(Math.random() * praiseList.length)];
      resultBox.className = 'result-box result-correct';
      title.innerText = `⭕ 正解！ ${randomPraise.en}（${randomPraise.jp}）`;
      correctAns.innerText = `正解: ${displayAns}`;
      btnNext.style.display = 'block';
      btnNext.innerText = '次の問題へ進む ▶';
      btnNext.onclick = nextQuestion;
    } else {
      comboCount = 0;
      wrongCount++;
      updateComboDisplay();

      const firstTargetWord = formatForAnswerBox(target[0], 0);
      let lastTargetWord = target[target.length - 2];
      if (!lastTargetWord || target.length <= 2) lastTargetWord = target[target.length - 1];

      if (wrongCount === 1) {
        resultBox.className = 'result-box result-hint';
        title.innerText = '❌ おしい！ もう一度ならべ直してみよう！';
        correctAns.innerHTML = `💡 <strong>ヒント (1/2):</strong> 1番目の単語は「<strong>${firstTargetWord}</strong>」だよ！`;
        btnNext.style.display = 'none';
      } else if (wrongCount === 2) {
        resultBox.className = 'result-box result-hint';
        title.innerText = '⚠️ もう一息！ ヒントを参考に考えてみよう！';
        correctAns.innerHTML = `💡 <strong>ヒント (2/2):</strong> 最初は「<strong>${firstTargetWord}</strong>」、最後は「<strong>${lastTargetWord}</strong>」だよ！`;
        btnNext.style.display = 'none';
      } else {
        isAnswered = true; // ★3回目ミスで答え表示後もロック
        document.getElementById('btn-submit-action').disabled = true;
        document.getElementById('btn-reset-action').disabled = true;

        resultBox.className = 'result-box result-wrong';
        title.innerText = '答えを確認して次に進もう！';
        correctAns.innerText = `正解: ${displayAns}`;
        btnNext.style.display = 'block';
        btnNext.innerText = '理解した！次へ進む ▶';
        btnNext.onclick = nextQuestion;
      }
    }
  }

  function nextQuestion() {
    if (currentIndex < currentQuestions.length - 1) {
      currentIndex++;
      loadQuestion(currentIndex);
    } else {
      saveClearedSubStage(currentSubStageId);
      addExp(50);
      showSubStageClearModal();
    }
  }

  }

  function closeCongratsModal() {
    document.getElementById('congrats-modal').style.display = 'none';
    stopConfetti();
    backToSubstageMenu();
  }

  // --- 全画面クラッカー演出 ---
  let confettiAnimationId = null;
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  let confettiParticles = [];

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function startFullPageConfetti() {
    confettiParticles = [];
    const colors = ['#00f0ff', '#ff2a85', '#a855f7', '#fde047', '#10b981'];
    for (let i = 0; i < 90; i++) {
      confettiParticles.push(createCrackerParticle(0, canvas.height, 1, colors));
      confettiParticles.push(createCrackerParticle(canvas.width, canvas.height, -1, colors));
    }
    if (!confettiAnimationId) animateConfetti();
  }

  function createCrackerParticle(startX, startY, direction, colors) {
    const angle = (direction === 1) 
      ? (Math.random() * 40 + 35) * (Math.PI / 180)
      : (Math.random() * 40 + 105) * (Math.PI / 180);
    const velocity = Math.random() * 16 + 14;

    return {
      x: startX, y: startY,
      vx: Math.cos(angle) * velocity,
      vy: -Math.sin(angle) * velocity,
      gravity: 0.38,
      size: Math.random() * 10 + 6,
      color: colors[Math.floor(Math.random() * colors.length)],
      angle: Math.random() * 360,
      spin: Math.random() * 10 - 5,
      friction: 0.985
    };
  }

  function animateConfetti() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    confettiParticles.forEach((p) => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += p.gravity;
      p.vx *= p.friction;
      p.angle += p.spin;

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate((p.angle * Math.PI) / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
      ctx.restore();
    });
    confettiAnimationId = requestAnimationFrame(animateConfetti);
  }

  function stopConfetti() {
    if (confettiAnimationId) {
      cancelAnimationFrame(confettiAnimationId);
      confettiAnimationId = null;
    }
    confettiParticles = [];
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  window.addEventListener('DOMContentLoaded', initMainMenu);
</script>
</body>
</html>
